<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKIHIRO PULSA</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:
radial-gradient(circle at 10% 20%, rgba(255,0,0,.4),transparent 30%),
#050505;

color:white;

}



.container{

max-width:700px;
margin:auto;
padding:20px;

}



.logo{

width:250px;
display:block;
margin:30px auto;

}



h1{

text-align:center;
color:red;
text-shadow:0 0 15px red;

}



.card{

background:#111;

border:1px solid #700;

border-radius:20px;

padding:25px;

margin-top:30px;

text-align:center;

}



input{

width:100%;

padding:15px;

border-radius:30px;

border:none;

margin:20px 0;

font-size:16px;

}



button{

padding:14px 30px;

border-radius:30px;

border:none;

background:red;

color:white;

font-weight:bold;

}



#result{

margin-top:25px;

display:none;

}



.provider{

font-size:25px;

color:red;

margin:15px;

}



</style>

</head>


<body>


<div class="container">


<img src="assets/logo.png" class="logo">



<h1>
📱 PULSA & KUOTA
</h1>



<div class="card">


<p>
Masukkan nomor HP kamu
</p>


<input 
id="phone"
placeholder="08xxxxxxxxxx"
type="number">



<button onclick="checkProvider()">

CEK NOMOR

</button>



<div id="result">


<div class="provider" id="providerName"></div>


<p>
Silahkan pilih produk
</p>


</div>



</div>


</div>


<script>

const providers = {

"0811":"Telkomsel",
"0812":"Telkomsel",
"0813":"Telkomsel",
"0821":"Telkomsel",
"0822":"Telkomsel",
"0851":"Telkomsel",
"0852":"Telkomsel",
"0853":"Telkomsel",

"08515":"by.U",
"08516":"by.U",
"08517":"by.U",
"08518":"by.U",
"08519":"by.U",

"0855":"Indosat",
"0856":"Indosat",
"0857":"Indosat",
"0858":"Indosat",

"0881":"Smartfren",
"0882":"Smartfren",
"0883":"Smartfren",

"0895":"Tri",
"0896":"Tri",
"0897":"Tri",

"0877":"XL",
"0878":"XL",

"0838":"Axis"

};



function checkProvider(){


let nomor = document.getElementById("phone").value;



// hapus spasi
nomor = nomor.replace(/\s/g,'');



// cek format

if(!nomor.startsWith("08")){

alert("❌ Nomor harus diawali 08");

return;

}



// ambil prefix

let prefix5 = nomor.substring(0,5);
let prefix4 = nomor.substring(0,4);



let provider = providers[prefix5] || providers[prefix4];



if(provider){


document.getElementById("result").style.display="block";


document.getElementById("providerName").innerHTML =
"✅ "+provider;



}else{


alert(
"❌ Provider tidak ditemukan"
);


}


}


</script>


</body>

</html>
