<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKIHIRO WHATSAPP BOT</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#050505;
color:white;
}


.container{

max-width:700px;
margin:auto;
padding:20px;

}


/* HEADER */

.top-header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;

}


.mini-logo{

width:110px;

filter:drop-shadow(0 0 10px red);

}


.header-right{

display:flex;
gap:15px;
align-items:center;
font-size:22px;

}


.header-right a{

color:white;
text-decoration:none;
font-size:25px;

}



/* BANNER */


.banner{

width:100%;
border-radius:20px;
margin:20px 0;
box-shadow:0 0 25px red;

}



/* TITLE */


h1{

text-align:center;
color:red;
font-size:32px;
margin:20px 0;
text-shadow:0 0 15px red;

}



.subtitle{

text-align:center;
color:#aaa;
font-size:18px;
margin-bottom:25px;

}



/* FEATURES */


.features{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
margin:25px 0;

}



.features div{

background:#111;
border:1px solid #700;
border-radius:15px;
padding:12px 5px;
text-align:center;
font-size:13px;
color:#ddd;

}



/* PACKAGE */


.package-list{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}



.card{

background:#111;
border:1px solid #700;
border-radius:18px;
padding:18px;
margin:0;
box-shadow:0 0 15px #300;
text-align:center;

}


.card h2{

color:#ff3030;
font-size:20px;

}


.price{

font-size:24px;
margin:10px 0;

}


.card p{

color:#aaa;
font-size:14px;
line-height:22px;

}



.btn{

display:inline-block;
margin-top:15px;
padding:10px 25px;
background:red;
color:white;
border:0;
border-radius:30px;
font-size:15px;
cursor:pointer;

}



.back{

display:block;
text-align:center;
margin:30px;
color:red;
text-decoration:none;

}
