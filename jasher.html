<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKIHIRO JASHER</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{
background:#050505;
color:white;
}


.container{
max-width:700px;
margin:auto;
padding:20px;
}


.logo{
width:80%;
display:block;
margin:20px auto;
filter:drop-shadow(0 0 20px red);
}


h1{
text-align:center;
color:red;
margin:20px;
}



.card{

background:#111;
border:1px solid #600;
border-radius:20px;
padding:25px;
margin:20px 0;

}


.card h2{

color:#ff2020;

}


.price{

font-size:30px;
margin:15px 0;

}



button{

background:red;
color:white;
border:0;
padding:15px 30px;
border-radius:30px;

}



.popup{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000000dd;
align-items:center;
justify-content:center;

}



.popup-box{

background:#111;
border:2px solid red;
border-radius:20px;
padding:25px;
text-align:center;

}



.qris{

width:250px;

}


.close{

background:#333;
margin-top:15px;

}



.back{

display:block;
text-align:center;
color:red;
margin-top:30px;

}


</style>

</head>



<body>


<div class="container">


<img src="logo.png" class="logo">



<h1>
🛠 JASHER
</h1>




<div class="card">


<h2>
Setup Server
</h2>


<div class="price">

Rp -

</div>


<p>
Install Panel<br>
Setup VPS<br>
Konfigurasi Server
</p>


<br>


<button onclick="payment('Setup Server')">

ORDER

</button>


</div>






<div class="card">


<h2>
Custom Server
</h2>


<div class="price">

Rp -

</div>


<p>
Custom sesuai kebutuhan<br>
Support sampai selesai
</p>


<br>


<button onclick="payment('Custom Server')">

ORDER

</button>


</div>





<a class="back" href="index.html">

← Kembali

</a>



</div>






<div class="popup" id="pay">


<div class="popup-box">


<h2>
Pembayaran
</h2>


<p id="nama"></p>


<img src="qris.png" class="qris">


<br>


<button class="close" onclick="closePay()">

Tutup

</button>


</div>


</div>




<script>


function payment(nama){

document.getElementById("pay").style.display="flex";


document.getElementById("nama").innerHTML=
"Order : "+nama;


}



function closePay(){

document.getElementById("pay").style.display="none";

}


</script>



</body>

</html>
